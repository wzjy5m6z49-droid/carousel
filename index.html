<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />

<title>Carousel Test</title>

<style>

html,
body{
  margin:0;
  padding:0;
  background:#0f0f10;
  font-family:
    "Segoe UI",
    sans-serif;
  overflow:hidden;
}

.wrap{
  display:flex;
  gap:24px;

  padding:32px;

  overflow-x:auto;
  overflow-y:hidden;

  scroll-behavior:smooth;

  scrollbar-width:none;
}

.wrap::-webkit-scrollbar{
  display:none;
}

.card{
  min-width:320px;
  max-width:320px;

  background:#1b1b1d;

  border-radius:24px;

  overflow:hidden;

  cursor:pointer;

  transition:
    transform .35s ease,
    box-shadow .35s ease;

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);
}

.card:hover{
  transform:translateY(-8px);

  box-shadow:
    0 20px 40px rgba(0,0,0,.45);
}

.card img{
  width:100%;
  height:190px;

  object-fit:cover;

  display:block;
}

.content{
  padding:22px;
}

.title{
  font-size:22px;
  font-weight:700;

  color:#fff;

  margin-bottom:10px;

  line-height:1.4;
}

.desc{
  font-size:15px;

  color:rgba(255,255,255,.75);

  line-height:1.6;
}

</style>
</head>

<body>

<div
  class="wrap"
  id="app">
</div>

<script src="https://digitalgojp.sharepoint.com/sites/NTA_IBHub12/SiteAssets/carousel/carousel-data.js"></script>

<script>

const app =
  document.getElementById("app");

const items =
  window.carouselData || [];

items
  .sort((a,b) => a.priority - b.priority)
  .forEach(item => {

    if(item.isActive !== true){
      return;
    }

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <img src="${item.image}">

      <div class="content">

        <div class="title">
          ${item.title}
        </div>

        <div class="desc">
          ${item.description}
        </div>

      </div>
    `;

    card.onclick = () => {

      if(item.link){
        window.open(item.link, "_blank");
      }

    };

    app.appendChild(card);

  });


/* =========================
   自動スクロール
========================= */

let current = 0;

setInterval(() => {

  current++;

  if(current >= items.length){
    current = 0;
  }

  app.scrollTo({
    left: current * 344,
    behavior: "smooth"
  });

}, 3000);

</script>

</body>
</html>
